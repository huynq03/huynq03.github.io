---
layout: compress
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nguyen Quang Huy — Robotics & Mechatronics Engineer">
  <title>{% if page.url != "/" %}{{ page.title }} — {% endif %}Nguyen Quang Huy — Robotics &amp; Mechatronics Engineer</title>
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="portfolio-site">
  <header class="portfolio-header portfolio-container">
    <a class="portfolio-brand" href="{{ '/' | relative_url }}">HUY</a>
    <nav aria-label="Main navigation">
      {% for link in site.data.navigation.main %}<a href="{{ link.url | relative_url }}">{{ link.title }}</a>{% endfor %}
    </nav>
  </header>
  <main class="portfolio-container">{{ content }}</main>
  <footer class="portfolio-footer portfolio-container">© {{ 'now' | date: '%Y' }} Nguyen Quang Huy</footer>
</body>
</html>
